<svg xmlns="http://www.w3.org/2000/svg" width="900" height="920" viewBox="0 0 900 920" role="img" aria-labelledby="title description">
  <title id="title">style.css cluster map</title>
  <desc id="description">Five vertically stacked monochrome boxes grouping the CSS rules. The last box is faded to indicate more styles continue.</desc>
  <rect width="900" height="920" fill="#000"/>
  <text x="450" y="52" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16">style.css</text>

  <rect x="100" y="88" width="700" height="126" fill="#000" stroke="#fff" stroke-width="2"/>
  <text x="126" y="126" fill="#fff" font-family="monospace" font-size="19">01  GLOBAL FOUNDATION</text>
  <text x="126" y="161" fill="#fff" font-family="monospace" font-size="14">body · * · img · links · form controls · keyboard focus</text>
  <text x="126" y="188" fill="#aaa" font-family="monospace" font-size="12">Base typography, colors, sizing, and accessible focus styles</text>

  <rect x="100" y="232" width="700" height="126" fill="#000" stroke="#fff" stroke-width="2"/>
  <text x="126" y="270" fill="#fff" font-family="monospace" font-size="19">02  NAVIGATION + SHARED COMPONENTS</text>
  <text x="126" y="305" fill="#fff" font-family="monospace" font-size="14">.site-nav · .brand · .nav-links · .page · .button</text>
  <text x="126" y="332" fill="#aaa" font-family="monospace" font-size="12">Reusable layout, headings, labels, and calls to action</text>

  <rect x="100" y="376" width="700" height="126" fill="#000" stroke="#fff" stroke-width="2"/>
  <text x="126" y="414" fill="#fff" font-family="monospace" font-size="19">03  HOME + PRODUCT CARDS</text>
  <text x="126" y="449" fill="#fff" font-family="monospace" font-size="14">.hero · .featured · .card-grid · .card · .price</text>
  <text x="126" y="476" fill="#aaa" font-family="monospace" font-size="12">Home introduction and bestseller bundle presentation</text>

  <rect x="100" y="520" width="700" height="126" fill="#000" stroke="#fff" stroke-width="2"/>
  <text x="126" y="558" fill="#fff" font-family="monospace" font-size="19">04  OTHER PAGE CONTENT</text>
  <text x="126" y="593" fill="#fff" font-family="monospace" font-size="14">About: .story · .team  /  Contact: .contact-layout · .faq</text>
  <text x="126" y="620" fill="#aaa" font-family="monospace" font-size="14">Menu: .menu-category · .menu-group · .menu-item</text>

  <g opacity="0.42">
    <rect x="100" y="664" width="700" height="126" fill="#000" stroke="#fff" stroke-width="2"/>
    <text x="126" y="702" fill="#fff" font-family="monospace" font-size="19">05  FOOTER + RESPONSIVE RULES</text>
    <text x="126" y="737" fill="#fff" font-family="monospace" font-size="14">.site-footer · .footer-content · @media (900px / 620px)</text>
    <text x="126" y="764" fill="#fff" font-family="monospace" font-size="12">…and more rules continue below</text>
  </g>

  <text x="450" y="842" text-anchor="middle" fill="#777" font-family="monospace" font-size="12">Grouped by the main selector sections in Project/Core/style.css</text>
</svg>
