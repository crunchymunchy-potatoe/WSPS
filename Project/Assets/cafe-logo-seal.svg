      <path d="M240 197 H252 A14 14 0 0 1 252 225 H238"/>
      <path d="M135 264 H255"/>
      <path d="M172 168 q-9 -11 0 -22 q9 -11 0 -22"/>
      <path d="M195 168 q-9 -11 0 -22 q9 -11 0 -22"/>
