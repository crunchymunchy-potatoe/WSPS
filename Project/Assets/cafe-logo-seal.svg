<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Café logo: circular seal with a coffee cup" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="top-arc" d="M 58,200 A 142,142 0 0 1 342,200"/>
    <path id="bottom-arc" d="M 40,200 A 160,160 0 0 0 360,200"/>
  </defs>
  <g fill="none" stroke="#3B2A20" stroke-linecap="round" stroke-linejoin="round">
    <!-- rings -->
    <circle cx="200" cy="200" r="190" stroke-width="6"/>
    <circle cx="200" cy="200" r="174" stroke-width="2"/>
    <circle cx="200" cy="200" r="118" stroke-width="2"/>
