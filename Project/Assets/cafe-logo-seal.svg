  <g fill="#3B2A20" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="5">
    <text text-anchor="middle"><textPath href="#top-arc" startOffset="50%">CAFÉ NAME</textPath></text>
    <text text-anchor="middle" font-size="20" letter-spacing="4"><textPath href="#bottom-arc" startOffset="50%">COFFEE · PASTRY</textPath></text>
