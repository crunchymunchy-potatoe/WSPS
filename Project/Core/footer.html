<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=, initial-scale=1.0">
	<title>Footer</title>
	<link rel="stylesheet" href="style.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@300..700&amp;display=swap" rel="stylesheet">
</head>
<body>

   <footer class="foot">

      <div class="foot-content">
          <!--footer-left-->
          <div class="foot-brand">
              <img class="foot-logo" src="/Project/Assets/Old-Logo/cafe-logo-white.png" alt="Logo Kafe">
              <h1>Down to Earth, Always Grounded</h1>
              <p>謙虚に、地に足をつけて</p>
          </div>

          <!--footer-mid-->
          <div class="foot-exp">
             <h4>Explore</h4>
             <li><a href="">Home</a></li>
             <li><a href="">Menu</a></li>
             <li><a href="">About Us</a></li>
             <li><a href="">Contact Us</a></li>
          </div>

          <!--footer-right-->
          <div class="foot-right">

              <h4>Visit</h4>

              <div class="foot-visit">
                  <span class="label">Hours</span>
                  <span class="line"></span>
                  <span class="value">9AM-10PM</span>
              </div>

              <div class="foot-visit">
                  <span class="label">Address</span>
                  <span class="line"></span>
                  <span class="value">Bitera,Gianyar</span>
              </div>

              <div class="foot-visit">
                  <span class="label">Email</span>
                  <span class="line"></span>
                  <span class="value">zrada@company.co</span>
              </div>

          </div>
      </div>

      <!--footer-bottom-->
      <div class="foot-bottom">
          <span class="bottom-left">@ 2027 GROUND 0</span>
          <span class="bottom-right">MADE BY GROUP 3</span>
      </div>

   </footer>

</body>
</html>
